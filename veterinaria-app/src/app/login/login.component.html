<form (ngSubmit)="login()" style="max-width: 400px; margin: auto;">
  <h2>Iniciar sesión</h2>

  <div>
    <label for="username">Usuario:</label>
    <input
      type="text"
      id="username"
      placeholder="Usuario"
      [(ngModel)]="username"
      name="username"
      required
    />
  </div>

  <div>
    <label for="password">Contraseña:</label>
    <input
      type="password"
      id="password"
      placeholder="Contraseña"
      [(ngModel)]="password"
      name="password"
      required
    />
  </div>

  <button type="submit">Entrar</button>

  <!-- Enlace para registrarse -->
  <p style="margin-top: 10px;">
  <a (click)="irARegistro()" style="cursor: pointer;">¿No tienes cuenta? Regístrate</a>

  </p>
</form>
